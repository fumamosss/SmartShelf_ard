; PlatformIO project configuration
; SmartWardrobe ESP32 - Wi-Fi provisioning foundation

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
; Arduino-ESP32 2.0.17 bug: weak btInUse() in esp32-hal-misc.c returns false,
; causing initArduino() to release BT memory before setup() runs.
; Force-linking esp32-hal-bt.c.o via btStarted() reference fixes this.
; See: https://github.com/espressif/arduino-esp32/issues/8176
lib_archive = no
